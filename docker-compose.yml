version: '3.8'

services:
  # Example: User 1 - Account 1 Container
  clashbot_user1_inst1:
    build: .
    container_name: clashbot_user1_inst1
    environment:
      - CLASHBOT_HOST_IP=0.0.0.0
    ports:
      - "29171:29170"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clashbot-bot1.rule=Host(`bot1.clashbot-ai.devtushar.uk`)"
      - "traefik.http.services.clashbot-bot1.loadbalancer.server.port=29170"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  # Example: User 1 - Account 2 Container
  clashbot_user1_inst2:
    build: .
    container_name: clashbot_user1_inst2
    environment:
      - CLASHBOT_HOST_IP=0.0.0.0
    ports:
      - "29172:29170"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clashbot-bot2.rule=Host(`bot2.clashbot-ai.devtushar.uk`)"
      - "traefik.http.services.clashbot-bot2.loadbalancer.server.port=29170"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  # Example: User 2 - Account 1 Container
  clashbot_user2_inst1:
    build: .
    container_name: clashbot_user2_inst1
    environment:
      - CLASHBOT_HOST_IP=0.0.0.0
    ports:
      - "29173:29170"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clashbot-bot3.rule=Host(`bot3.clashbot-ai.devtushar.uk`)"
      - "traefik.http.services.clashbot-bot3.loadbalancer.server.port=29170"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5

  # Website Hosting Service
  website_server:
    image: nginx:alpine
    container_name: clashbot_website
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.clashbot-web.rule=Host(`clashbot-ai.devtushar.uk`)"
      - "traefik.http.services.clashbot-web.loadbalancer.server.port=80"
    volumes:
      - ./Website:/usr/share/nginx/html:ro
    restart: unless-stopped

networks:
  dokploy-network:
    external: true

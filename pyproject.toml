[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clashbot-ai"
version = "2.0.0"
description = "Autonomous Computer Vision and Game Intelligence Platform for Clash of Clans"
readme = "README.md"
authors = [
  { name = "Aradhye Tushar", email = "aradhye@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "pure-python-adb>=0.3.0",
    "pytesseract>=0.3.10",
    "requests>=2.31.0",
    "cryptography>=41.0.0",
    "psutil>=5.9.0"
]

[project.urls]
Homepage = "https://github.com/AradhyeTushar/ClashBot-AI"
Repository = "https://github.com/AradhyeTushar/ClashBot-AI"
